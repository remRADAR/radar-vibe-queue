name: RADAR Core Brain validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registry, manifest and consistency validation
        run: node tools/validate-registry.mjs
      - name: Routing and regression tests
        run: node tests/routing.test.mjs
